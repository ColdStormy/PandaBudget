include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - linux/**
    - windows/**
    - "**/*.g.dart"
    - lib/l10n/generated/**
    - lib/database/migrations/schema_versions.dart
    - test/drift/**/generated/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # The app is not a published package; API docs on every member add noise.
    public_member_api_docs: false
    # Keeps widget trees and long calls readable at the formatter's width.
    lines_longer_than_80_chars: false
    # Positional booleans are fine for small private helpers.
    avoid_positional_boolean_parameters: false
    # `const new(...)` instead of `const ClassName(...)` is still unfamiliar
    # to most readers.
    unnecessary_type_name_in_constructor: false
